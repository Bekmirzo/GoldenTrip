<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Trip - Turistik Kompaniyasi</title>
    <link href="./css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .brand-logo {
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .brand-name {
            color: #ffc107 !important;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            font-weight: 800;
            letter-spacing: 1px;
        }
        /* Sticky footer учун қоидалар */
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; }
        #main_content { flex: 1 0 auto; }
        #footer_content { flex-shrink: 0; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand fs-4 d-flex align-items-center" href="#" id="nav_asosiy">
                <img src="./img/logo.jpg" alt="Golden Trip Logo" class="brand-logo me-2">
                <span class="brand-name">GOLDEN TRIP</span>
            </a>
            
            <div class="ms-auto">
                <div class="dropdown">
                    <button id="dw_main" class="btn btn-outline-warning dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-globe me-1"></i> O‘zbek
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark" id="lang_dropdown">
                        <li><button lng="uz" class="dropdown-item">O‘zbek</button></li>
                        <li><button lng="en" class="dropdown-item">English</button></li>
                        <li><button lng="ru" class="dropdown-item">Русский</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Banner (Динамик) -->
    <div id="header_text"></div>

    <!-- Асосий Контент (Динамик) -->
    <div id="main_content" class="py-5"></div>

    <!-- Footer қисми (Динамик) -->
    <div id="footer_content"></div>

    <script src="./js/bootstrap.bundle.js"></script>
    <script src="./js/text.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
